services:
  mysql:
    image: mysql:8.4
    container_name: food-search-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: food_search
      MYSQL_USER: food_search
      MYSQL_PASSWORD: food_password
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
volumes:
  mysql-data: